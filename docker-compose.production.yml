services:
  postgres:
    image: postgres:17
    container_name: vistaar-production-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vistaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vistaar_db}
    volumes:
      - vistaar_production_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: vistaar-app:production
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vistaar-production-migrate
    restart: "no"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - ./node_modules/.bin/prisma
      - migrate
      - deploy
      - --config
      - prisma7.config.ts

  app:
    image: vistaar-app:production
    container_name: vistaar-production-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  vistaar_production_data:
